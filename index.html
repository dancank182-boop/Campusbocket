<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CampusPocket</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f8;
    color: #17202a;
}

header {
    background: #1769aa;
    color: white;
    padding: 25px 20px;
    border-radius: 0 0 25px 25px;
}

header h1 {
    font-size: 28px;
    margin-bottom: 6px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.card h2 {
    margin-bottom: 15px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.stat {
    padding: 18px;
    border-radius: 15px;
    background: #eef6ff;
}

.stat h3 {
    font-size: 28px;
    margin-bottom: 5px;
}

.stat p {
    color: #667085;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
}

button {
    border: none;
    padding: 12px 15px;
    border-radius: 10px;
    background: #1769aa;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.add-btn {
    width: 100%;
}

.assignment {
    border: 1px solid #e1e5e9;
    border-radius: 12px;
    padding: 15px;
    margin-top: 12px;
}

.assignment h3 {
    margin-bottom: 6px;
}

.assignment p {
    color: #667085;
    margin-bottom: 8px;
}

.completed {
    opacity: 0.6;
    text-decoration: line-through;
}

.overdue {
    border-left: 5px solid #dc3545;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.complete-btn {
    background: #198754;
}

.delete-btn {
    background: #dc3545;
}

.empty {
    color: #777;
    text-align: center;
    padding: 15px;
}

footer {
    text-align: center;
    color: #777;
    padding: 25px;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <h1>🎓 CampusPocket</h1>
    <p>Your student companion</p>
</header>

<div class="container">

    <!-- DASHBOARD -->

    <div class="card">

        <h2>📊 Dashboard</h2>

        <div class="stats">

            <div class="stat">
                <h3 id="total">0</h3>
                <p>Total Assignments</p>
            </div>

            <div class="stat">
                <h3 id="pending">0</h3>
                <p>Pending</p>
            </div>

            <div class="stat">
                <h3 id="completed">0</h3>
                <p>Completed</p>
            </div>

            <div class="stat">
                <h3 id="overdue">0</h3>
                <p>Overdue</p>
            </div>

        </div>

    </div>


    <!-- ADD ASSIGNMENT -->

    <div class="card">

        <h2>📝 Add Assignment</h2>

        <input
            type="text"
            id="assignmentName"
            placeholder="Assignment name"
        >

        <input
            type="text"
            id="courseName"
            placeholder="Course / Unit"
        >

        <input
            type="date"
            id="deadline"
        >

        <button
            class="add-btn"
            onclick="addAssignment()">

            + Add Assignment

        </button>

    </div>


    <!-- ASSIGNMENTS -->

    <div class="card">

        <h2>📚 My Assignments</h2>

        <div id="assignmentList"></div>

    </div>

</div>


<footer>
    CampusPocket © 2026
</footer>


<script>

let assignments =
    JSON.parse(localStorage.getItem("assignments")) || [];


/* SAVE DATA */

function saveAssignments() {

    localStorage.setItem(
        "assignments",
        JSON.stringify(assignments)
    );

}


/* ADD ASSIGNMENT */

function addAssignment() {

    const name =
        document
        .getElementById("assignmentName")
        .value
        .trim();

    const course =
        document
        .getElementById("courseName")
        .value
        .trim();

    const deadline =
        document
        .getElementById("deadline")
        .value;


    if (!name || !course || !deadline) {

        alert("Please fill in all fields.");

        return;
    }


    const assignment = {

        id: Date.now(),

        name: name,

        course: course,

        deadline: deadline,

        completed: false

    };


    assignments.push(assignment);

    saveAssignments();


    document
    .getElementById("assignmentName")
    .value = "";

    document
    .getElementById("courseName")
    .value = "";

    document
    .getElementById("deadline")
    .value = "";


    displayAssignments();

    updateDashboard();

}


/* COMPLETE */

function completeAssignment(id) {

    assignments =
        assignments.map(function(assignment) {

            if (assignment.id === id) {

                assignment.completed =
                    !assignment.completed;

            }

            return assignment;

        });


    saveAssignments();

    displayAssignments();

    updateDashboard();

}


/* DELETE */

function deleteAssignment(id) {

    if (!confirm("Delete this assignment?")) {

        return;

    }


    assignments =
        assignments.filter(function(assignment) {

            return assignment.id !== id;

        });


    saveAssignments();

    displayAssignments();

    updateDashboard();

}


/* CHECK OVERDUE */

function isOverdue(assignment) {

    if (assignment.completed) {

        return false;

    }


    const today =
        new Date();

    today.setHours(0,0,0,0);


    const deadline =
        new Date(assignment.deadline);

    deadline.setHours(0,0,0,0);


    return deadline < today;

}


/* DISPLAY */

function displayAssignments() {

    const list =
        document
        .getElementById("assignmentList");


    if (assignments.length === 0) {

        list.innerHTML =
        '<div class="empty">No assignments yet.</div>';

        return;

    }


    list.innerHTML = "";


    assignments.forEach(function(assignment) {

        const item =
            document.createElement("div");


        item.className = "assignment";


        if (assignment.completed) {

            item.classList.add("completed");

        }


        if (isOverdue(assignment)) {

            item.classList.add("overdue");

        }


        item.innerHTML = `

            <h3>${assignment.name}</h3>

            <p>📚 ${assignment.course}</p>

            <p>📅 ${assignment.deadline}</p>

            ${
                isOverdue(assignment)
                ? "<p>🔴 OVERDUE</p>"
                : ""
            }

            <div class="actions">

                <button
                    class="complete-btn"
                    onclick="completeAssignment(${assignment.id})">

                    ${
                        assignment.completed
                        ? "↩ Undo"
                        : "✓ Complete"
                    }

                </button>


                <button
                    class="delete-btn"
                    onclick="deleteAssignment(${assignment.id})">

                    🗑 Delete

                </button>

            </div>

        `;


        list.appendChild(item);

    });

}


/* DASHBOARD */

function updateDashboard() {

    const total =
        assignments.length;


    const completed =
        assignments.filter(function(a) {

            return a.completed;

        }).length;


    const pending =
        total - completed;


    const overdue =
        assignments.filter(function(a) {

            return isOverdue(a);

        }).length;


    document
    .getElementById("total")
    .innerText = total;


    document
    .getElementById("pending")
    .innerText = pending;


    document
    .getElementById("completed")
    .innerText = completed;


    document
    .getElementById("overdue")
    .innerText = overdue;

}


/* START APP */

displayAssignments();

updateDashboard();

</script>

</body>
</html>

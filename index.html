<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CampusPocket</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f8;
    color: #17202a;
}

header {
    background: #1769aa;
    color: white;
    padding: 25px 20px;
    border-radius: 0 0 25px 25px;
}

header h1 {
    font-size: 28px;
    margin-bottom: 6px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.card h2 {
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
}

button {
    border: none;
    padding: 12px 15px;
    border-radius: 10px;
    background: #1769aa;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.add-btn {
    width: 100%;
    margin-top: 5px;
}

.assignment {
    border: 1px solid #e1e5e9;
    border-radius: 12px;
    padding: 15px;
    margin-top: 12px;
}

.assignment h3 {
    margin-bottom: 6px;
}

.assignment p {
    color: #667085;
    margin-bottom: 10px;
}

.completed {
    opacity: 0.6;
    text-decoration: line-through;
}

.actions {
    display: flex;
    gap: 8px;
}

.complete-btn {
    background: #198754;
}

.delete-btn {
    background: #dc3545;
}

.empty {
    color: #777;
    text-align: center;
    padding: 15px;
}

footer {
    text-align: center;
    color: #777;
    padding: 25px;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <h1>🎓 CampusPocket</h1>
    <p>Your student companion</p>
</header>

<div class="container">

    <div class="card">
        <h2>📝 Add Assignment</h2>

        <input
            type="text"
            id="assignmentName"
            placeholder="Assignment name"
        >

        <input
            type="text"
            id="courseName"
            placeholder="Course / Unit"
        >

        <input
            type="date"
            id="deadline"
        >

        <button class="add-btn" onclick="addAssignment()">
            + Add Assignment
        </button>
    </div>

    <div class="card">
        <h2>📚 My Assignments</h2>

        <div id="assignmentList"></div>
    </div>

</div>

<footer>
    CampusPocket © 2026
</footer>

<script>

let assignments =
    JSON.parse(localStorage.getItem("assignments")) || [];


function saveAssignments() {
    localStorage.setItem(
        "assignments",
        JSON.stringify(assignments)
    );
}


function addAssignment() {

    const name =
        document.getElementById("assignmentName").value.trim();

    const course =
        document.getElementById("courseName").value.trim();

    const deadline =
        document.getElementById("deadline").value;


    if (!name || !course || !deadline) {
        alert("Please fill in all fields.");
        return;
    }


    const assignment = {
        id: Date.now(),
        name: name,
        course: course,
        deadline: deadline,
        completed: false
    };


    assignments.push(assignment);

    saveAssignments();

    document.getElementById("assignmentName").value = "";
    document.getElementById("courseName").value = "";
    document.getElementById("deadline").value = "";

    displayAssignments();
}


function completeAssignment(id) {

    assignments = assignments.map(function(assignment) {

        if (assignment.id === id) {
            assignment.completed = !assignment.completed;
        }

        return assignment;
    });

    saveAssignments();

    displayAssignments();
}


function deleteAssignment(id) {

    if (!confirm("Delete this assignment?")) {
        return;
    }

    assignments =
        assignments.filter(function(assignment) {
            return assignment.id !== id;
        });

    saveAssignments();

    displayAssignments();
}


function displayAssignments() {

    const list =
        document.getElementById("assignmentList");


    if (assignments.length === 0) {

        list.innerHTML =
            '<div class="empty">No assignments yet.</div>';

        return;
    }


    list.innerHTML = "";


    assignments.forEach(function(assignment) {

        const item =
            document.createElement("div");

        item.className = "assignment
